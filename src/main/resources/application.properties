spring.application.name=ricettario

# collegamento db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ricettario}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root}

# Mostra query in console
# udate solo in sviluppo al primo avvio crea tabelle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Abilita i metodi delete update con hidden input
spring.mvc.hiddenmethod.filter.enabled=true

# Start data sql not at first alunch when creating db
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

#Percorso storage
app.upload.dir=${UPLOAD_DIR:C:/Users/idrog/Desktop/Progetti/Java/Spring/file-storage}

#API Key
gemini.api.key=${GEMINI_API_KEY}
spring.config.import=optional:dotenv:.env

#jwt
jwt.secret=QkRcdyFW/rZgJFOeWcEgDJMuIdn225DEArKkA7jhPvg=
jwt.expiration-ms=86400000000

#Error management
spring.web.error.include-stacktrace=always
spring.web.error.include-message=always


<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Home ricettario</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container mt-5">

            <form th:action="@{${rating.recipeId == null} ? '/ratings/create' : '/ratings/' + ${rating.recipeId}}"
                th:method="${rating.recipeId == null} ? 'post' : 'put'" th:object="${rating}"
                enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="difficulty" class="form-label">Difficoltà</label>
                    <input type="number" class="form-control" id="difficulty" th:field="*{difficulty}"
                        th:classappend="${#fields.hasErrors('difficulty')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il voto alla difficoltà" min="1" max="5">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('difficulty')}"
                        th:errors="*{difficulty}"></span>
                </div>
                <div class="mb-3">
                    <label for="cost" class="form-label">Costo</label>
                    <input type="number" class="form-control" id="cost" th:field="*{cost}"
                        th:classappend="${#fields.hasErrors('cost')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il voto per il costo" min="1" max="5">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></span>
                </div>
                <div class="mb-3">
                    <label for="prepTime" class="form-label">Tempo di preparazione</label>
                    <input type="number" class="form-control" id="prepTime" th:field="*{prepTime}"
                        th:classappend="${#fields.hasErrors('prepTime')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il voto per il tempo" min="1" max="5">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('prepTime')}"
                        th:errors="*{prepTime}"></span>
                </div>
                <div class="mb-3">
                    <label for="tasteIntensity" class="form-label">Intensità del gusto</label>
                    <input type="number" class="form-control" id="tasteIntensity" th:field="*{tasteIntensity}"
                        th:classappend="${#fields.hasErrors('tasteIntensity')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il voto per il gusto" min="1" max="5">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('tasteIntensity')}"
                        th:errors="*{tasteIntensity}"></span>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary"
                        th:text="${rating.recipeId == null} ? 'Aggiungi' : 'Modifica'">

                    </button>
                </div>

            </form>

        </div>

    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>

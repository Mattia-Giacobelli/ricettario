<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Ratings</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container">

            <div class="d-flex justify-content-between align-items-center pt-4 pb-5">

                <h1>Ratings</h1>

                <!-- <a href="/ratings/create" class="btn btn-primary">
                    Aggiungi Rating
                </a> -->

            </div>

            <h4 th:if="${msg != null}" class="mt-3 mb-3" th:text="${msg}">

            </h4>

            <h1 class="text-center" th:if="${ratings.size == 0}">
                Nessun rating trovato
            </h1>

            <table class="table" th:if="${ratings.size > 0}">

                <thead>

                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Ricetta</th>
                        <th scope="col">Difficoltà</th>
                        <th scope="col">Costo</th>
                        <th scope="col">Tempo di preparazione</th>
                        <th scope="col">Intensità del gusto</th>
                        <th scope="col">Overall</th>
                        <th scope="col"></th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="rating: ${ratings}">

                        <td th:text="${rating.recipeId}"></td>
                        <td th:text="${rating.recipe.name}"></td>
                        <td th:text="${rating.difficulty}"></td>
                        <td th:text="${rating.cost}"></td>
                        <td th:text="${rating.prepTime}"></td>
                        <td th:text="${rating.tasteIntensity}"></td>
                        <td th:text="${rating.overall}"></td>


                        <td>
                            <!-- <a th:href="@{/ratings/update/{id}(id=${rating.recipeId})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i>
                            </a> -->
                            <button sec:authorize="hasRole('ADMIN')" type="button" class="btn btn-danger"
                                data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${rating.recipeId}">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>

                        <!-- Modal -->
                        <div class="modal fade" th:id="'deleteModal' + ${rating.recipeId}" tabindex="-1"
                            aria-labelledby="deleteModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="deleteModalLabel">Modal title</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body"
                                        th:text="'Sei sicuro di voler eliminare' + ${rating.recipe.name} + '?'">

                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Annulla</button>
                                        <form th:action="@{/ratings/{id}(id=${rating.recipeId})}" th:method="delete">
                                            <button type="submit" class="btn btn-danger">Elimina</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </tr>

                    <tr th:if="${id!=null}">
                        <th scope="row" th:text="${id}"></th>
                        <td th:text="${msg}"></td>
                    </tr>

                </tbody>

            </table>

            <div class="pagination-container">
                <nav aria-label="Page navigation">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${!ratings.hasPrevious()} ? 'disabled'">
                            <a class="page-link" th:href="@{/ratings(page=${ratings.number - 1})}">Precedente</a>
                        </li>

                        <li class="page-item disabled">
                            <span class="page-link">
                                Pagina <span th:text="${ratings.number + 1}">1</span> di <span
                                    th:text="${ratings.totalPages}">1</span>
                            </span>
                        </li>

                        <li class="page-item" th:classappend="${!ratings.hasNext()} ? 'disabled'">
                            <a class="page-link" th:href="@{/ratings(page=${ratings.number + 1})}">Successivo</a>
                        </li>

                    </ul>
                </nav>
            </div>

        </div>

    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>

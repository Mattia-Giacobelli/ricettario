<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Ingredienti</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container">

            <h1 th:text="${user.id == null ? 'Aggiungi utente' : 'Modifica utente'}">

            </h1>

            <form th:method="${user.id == null} ? 'post' : 'put'"
                th:action="@{${#authentication.name != user.username} ? '/users/' + ${user.id} : 'users/update'}"
                th:object="${user}">


                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">
                    <span class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                    </span>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}"
                        th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">
                    <span class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}"></span>
                </div>

                <div sec:authorize="hasRole('ADMIN')" class="mb-3">
                    <label for="permission" class="form-label">Permesso</label>
                    <select class="form-select" id="permission" th:field="*{permission}"
                        th:classappend="${#fields.hasErrors('permission') || pass == false} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Seleziona Permesso">

                        <option value="" selected th:if="${id == null}">Seleziona il permesso</option>

                        <option th:each="perm : ${permissions}" th:value="${perm.id}" th:text="${perm.permissionType}">

                        </option>

                    </select>
                    <span class="invalid-feedback" th:if="${#fields.hasErrors('permission')}"
                        th:errors="*{permission}"></span>
                </div>

                <div class="mb-3">

                    <label for="password" class="form-label">Password</label>

                    <div class="input-group">

                        <input type="password" class="form-control" id="password" th:field="*{password}"
                            th:classappend="${#fields.hasErrors('password') || pass == false} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">

                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">

                            <span id="eyeIconOpen">
                                <i class="bi bi-eye"></i>
                            </span>

                            <span id="eyeIconClosed" class="d-none">
                                <i class="bi bi-eye-slash"></i>
                            </span>

                        </button>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"></span>

                        <span class="invalid-feedback" th:if="${pass == false}">La password
                            deve essere min 6 max 10 1 minusc,2 maiusc, 1 num,2 caratteri speciali tra #!&-</span>
                    </div>


                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary"
                        th:text="${user.id == null} ? 'Aggiungi' : 'Modifica'">

                    </button>
                </div>
            </form>

        </div>

    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Show pass -->
    <script th:src="@{/js/show-pass.js}"></script>

</body>

</html>

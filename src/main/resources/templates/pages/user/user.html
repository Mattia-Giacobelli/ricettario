<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Profilo</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container mb-5 d-flex flex-column justify-content-center align-items-center mt-5">

            <h4 th:if="${msg != null}" class="mt-3 mb-3" th:text="${msg}"></h4>

            <div class="card w-75">

                <div class="card-header d-flex justify-content-between align-items-center">

                    <h1 th:text="${user.username}">

                    </h1>

                    <a class="btn btn-warning"
                        th:href="${#authentication.name != user.username} ? @{/users/update/{id}(id=${user.id})} : @{/users/update}">
                        Modifica
                    </a>

                </div>

                <div class="card-body">

                    <div class="row row-cols-2">

                        <h3 th:text="'Username: ' + ${user.username}">

                        </h3>

                        <h3 th:text="'Email: ' + ${user.email}">

                        </h3>


                    </div>

                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Show pass
    <script th:src="@{/js/show-pass.js}"></script> -->

</body>

</html>

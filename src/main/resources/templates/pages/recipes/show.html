<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Home ricettario</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container mt-5">

            <div class="card">

                <div class="card-header">
                    <h1 th:text="${recipe.name}"></h1>
                </div>

                <div class="card-body">

                    <img th:src="@{${recipe.imageUrl}}" alt="recipe photo">

                    <h4>Descrizione:</h4>
                    <p th:text="${recipe.description}"></p>

                    <h4>Istruzioni:</h4>
                    <p th:text="${recipe.instructions}"></p>

                    <h4>Ingredienti:</h4>

                    <table class="table" th:if="${recipe.ingredients.size > 0}">

                        <thead>

                            <tr>
                                <th scope="col">Nome</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="recIng: ${recipe.ingredients}">
                                <td th:text="${recIng.ingredient.name}"></td>
                            </tr>
                        </tbody>
                    </table>

                    <h4>Tags:</h4>

                    <table class="table" th:if="${recipe.tags.size > 0}">

                        <thead>

                            <tr>
                                <th scope="col">Nome</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="tag: ${recipe.tags}">
                                <td th:text="${tag.name}"></td>
                            </tr>
                        </tbody>
                    </table>

                    <p
                        th:text="${recipe.timesPrep == 1} ? 'Preparata ' + ${recipe.timesPrep} + ' volta' : 'Preparata ' + ${recipe.timesPrep} + ' volte'">
                    </p>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>

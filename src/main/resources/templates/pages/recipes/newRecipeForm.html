<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <title>Nuova Ricetta</title>
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>

        <div class="container mt-5">

            <form th:action="@{${recipe.id == null} ? '/recipes/create' : '/recipes/' + ${recipe.id}}"
                th:method="${recipe.id == null} ? 'post' : 'put'" th:object="${recipe}" enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il nome della ricetta">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Foto</label>

                    <div th:if="${recipe.imageUrl != null}">
                        <p>Immagine attuale:</p>
                        <img th:src="@{${recipe.imageUrl}}" alt="Immagine ricetta" style="max-width:200px;">
                    </div>

                    <input type="file" class="form-control" id="image" name="image" accept="image/*">


                    <span class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{name}"></span>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descrizione</label>
                    <textarea type="text" class="form-control" id="description" th:field="*{description}"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci la descrizione della ricetta" th:text="*{description}"></textarea>

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}"></span>
                </div>

                <div class="mb-3">
                    <label for="instructions" class="form-label">Procedimento</label>
                    <textarea type="text" class="form-control" id="instructions" th:field="*{instructions}"
                        th:classappend="${#fields.hasErrors('instructions')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il procedimento" th:text="*{instructions}"></textarea>

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('instructions')}"
                        th:errors="*{instructions}"></span>
                </div>

                <div class="mb-3">
                    <label for="timesPrep" class="form-label">Preparazioni</label>
                    <input type="number" class="form-control" id="timesPrep" th:field="*{timesPrep}"
                        th:classappend="${#fields.hasErrors('timesPrep')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il numero di preparazioni">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('timesPrep')}"
                        th:errors="*{timesPrep}"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Tag</label>

                    <div class="position-relative mb-2">
                        <input type="text" id="tagSearchInput" class="form-control" placeholder="Cerca o crea tag..."
                            autocomplete="off" oninput="onTagSearch(this)">
                        <div id="tagSuggestions" class="list-group position-absolute w-100"
                            style="z-index:1000; display:none;"></div>
                    </div>

                    <div id="selectedTagsContainer" class="d-flex flex-wrap gap-2"></div>
                </div>

                <div class="mb-3">
                    <label>Ingredienti</label>
                    <div id="ingredientRows"></div>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="addIngredientRow()">+ Aggiungi
                        ingrediente</button>
                </div>

                <datalist id="ingredientOptions">
                    <option th:each="ing : ${allIngredients}" th:value="${ing.name}"></option>
                </datalist>

                <!-- RATING -->
                <fieldset class="mb-3">
                    <legend>Valutazione (1-5)</legend>

                    <label>Difficoltà</label>
                    <input type="number" min="1" max="5" th:field="*{rating.difficulty}"><br>

                    <label>Costo</label>
                    <input type="number" min="1" max="5" th:field="*{rating.cost}"><br>

                    <label>Tempo di preparazione</label>
                    <input type="number" min="1" max="5" th:field="*{rating.prepTime}"><br>

                    <label>Intensità di gusto</label>
                    <input type="number" min="1" max="5" th:field="*{rating.tasteIntensity}"><br>

                </fieldset>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary"
                        th:text="${recipe.id == null} ? 'Aggiungi' : 'Modifica'">

                    </button>
                </div>

            </form>

        </div>


        </div>

    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:inline="javascript">
        const availableIng = /*[[${recipe.ingredients}]]*/[];
        let rowIndex = 0;

        function addIngredientRow(data = null) {
            const container = document.getElementById('ingredientRows');
            const div = document.createElement('div');
            div.className = 'ingredient-row mb-2 d-flex gap-2';

            // Estrazione dei dati: gestisce sia RecipeIngredient (ing.ingredient.name) sia il form vuoto
            const name = data && data.name ? data.name : '';
            const quantity = data && data.quantity ? data.quantity : '';
            const unit = data && data.unit ? data.unit : '';
            const notes = data && data.notes ? data.notes : '';

            div.innerHTML = `
        <div class="w-25">
            <label>Nome</label>
            <input type="text" name="ingredients[${rowIndex}].name" value="${name}" list="ingredientOptions" placeholder="Nome ingrediente" class="form-control">
        </div>
        <div class="w-25">
            <label>Quantità</label>
            <input type="text" name="ingredients[${rowIndex}].quantity" value="${quantity}" placeholder="Quantità" class="form-control">
        </div>
        <div class="w-25">
            <label>Unità di misura</label>
            <input type="text" name="ingredients[${rowIndex}].unit" value="${unit}" placeholder="Unità (g, ml, pz...)" class="form-control">
        </div>
        <div class="w-25">
            <label>Note</label>
            <input type="text" name="ingredients[${rowIndex}].notes" value="${notes}" placeholder="Note" class="form-control">
        </div>
        <button type="button" class="btn btn-danger btn-sm align-self-end" onclick="this.parentElement.remove()">✕</button>
    `;

            container.appendChild(div);
            rowIndex++;
        }

        // Inizializzazione al caricamento della pagina
        document.addEventListener("DOMContentLoaded", () => {
            if (availableIng && availableIng.length > 0) {

                addIngredientRow();

                availableIng.forEach(ing => addIngredientRow(ing));
            } else {

                addIngredientRow();
            }
        });

    </script>

    <script th:inline="javascript">
        const availableTags = /*[[${allTags}]]*/[];
        const selectedTags = /*[[${recipeTags}]]*/[];
        let tagRowIndex = 0;

        function onTagSearch(input) {
            const suggestionsBox = document.getElementById('tagSuggestions');
            const query = input.value.trim().toLowerCase();

            if (query.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = availableTags.filter(tag =>
                tag.name.toLowerCase().includes(query) &&
                !selectedTags.some(sel => sel.name === tag.name)
            );

            let html = '';
            matches.slice(0, 8).forEach(tag => {
                html += `<button type="button" class="list-group-item list-group-item-action"
                            onclick="selectTag(${tag.id}, '${tag.name.replace(/'/g, "\\'")}')">
                            ${tag.name}
                         </button>`;
            });

            const exactMatch = availableTags.some(tag => tag.name.toLowerCase() === query);
            const alreadySelected = selectedTags.some(sel => (sel.label || '').toLowerCase() === query);

            if (!exactMatch && !alreadySelected) {
                html += `<button type="button" class="list-group-item list-group-item-action text-primary"
                            onclick="createNewTag('${input.value.trim().replace(/'/g, "\\'")}')">
                            + Crea nuovo tag "${input.value.trim()}"
                         </button>`;
            }

            suggestionsBox.innerHTML = html;
            suggestionsBox.style.display = html ? 'block' : 'none';
        }

        function selectTag(id, name) {
            selectedTags.push({ existingId: id, name: name, label: name });
            renderSelectedTags();
            clearTagSearch();
        }

        function createNewTag(name) {
            selectedTags.push({ existingId: null, name: name, label: name });
            renderSelectedTags();
            clearTagSearch();
        }

        function removeTag(index) {
            selectedTags.splice(index, 1);
            renderSelectedTags();
        }

        function clearTagSearch() {
            document.getElementById('tagSearchInput').value = '';
            document.getElementById('tagSuggestions').style.display = 'none';
        }

        function renderSelectedTags() {
            const container = document.getElementById('selectedTagsContainer');

            // rimuove i vecchi input hidden prima di ridisegnare
            container.innerHTML = '';

            selectedTags.forEach((tag, index) => {
                const chip = document.createElement('span');
                chip.className = 'badge bg-primary d-flex align-items-center gap-1 p-2';
                chip.innerHTML = `
                    ${tag.label || tag.name}
                    <button type="button" class="btn-close btn-close-white btn-sm" style="font-size:0.6rem;" onclick="removeTag(${index})"></button>
                    <input type="hidden" name="tags[${index}].existingId" value="${tag.existingId ?? ''}">
                    <input type="hidden" name="tags[${index}].name" value="${tag.name ?? ''}">
                `;
                container.appendChild(chip);
            });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#tagSearchInput') && !e.target.closest('#tagSuggestions')) {
                document.getElementById('tagSuggestions').style.display = 'none';
            }
        });

        document.addEventListener("DOMContentLoaded", (e) => {
            renderSelectedTags()
        })

    </script>


    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
